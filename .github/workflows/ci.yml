name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # 交付目标平台 —— 唯一阻断合并的 job。
  windows:
    name: windows (阻断)
    runs-on: windows-latest
    env:
      # 缓存只对本机反复跑门禁有意义；CI runner 每次都是全新机器，直接联网拉取。
      GPUI_PI_CACHE: OFF
    steps:
      - uses: actions/checkout@v4
      - name: 工具链（由 rust-toolchain.toml 决定版本）
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: 准备钉死的 pi 0.84.2 源码参考
        shell: pwsh
        run: .\scripts\fetch-pi-source.ps1
      - name: 准备钉死的 pi-web 0.8.9 对照基线
        shell: pwsh
        run: .\scripts\fetch-pi-web.ps1
      - name: 准备钉死的子代理执行内核 pi-subagents-lite 1.13.0
        shell: pwsh
        run: .\scripts\fetch-pi-subagents-lite.ps1
      - name: T1 全量验收
        shell: pwsh
        run: .\scripts\validate.ps1
