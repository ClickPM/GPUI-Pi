[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/ui",
    "crates/pi-rpc",
    "crates/pi-data",
    "crates/pi-render",
    "crates/pi-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cking000bigdemon/GPUI-Pi"
rust-version = "1.97"

[workspace.dependencies]
# ── 内部 crate ───────────────────────────────────────────────────────────────
pi-rpc = { path = "crates/pi-rpc" }
pi-data = { path = "crates/pi-data" }
pi-render = { path = "crates/pi-render" }
pi-runtime = { path = "crates/pi-runtime" }
gpui-pi-ui = { path = "crates/ui" }

# ── 上游 UI 栈 ───────────────────────────────────────────────────────────────
# 故意不写 rev：gpui-component 自身对 zed 的依赖也不带 rev，两边写法必须一致，
# 否则 cargo 会因为「同一 git URL 两个不同 reference」而拒绝解析。
# 真正的版本钉死落在 **提交进仓库的 Cargo.lock**，由 scripts/check-pins.* 校验。
# 期望 sha 见 docs/立项文档.md § 二，改动必须同步那张表。
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-base = { git = "https://github.com/longbridge/gpui-component" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# ── 通用 ─────────────────────────────────────────────────────────────────────
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
dirs = "6"
dunce = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
windows-sys = "0.61"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
